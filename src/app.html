<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kianda Imobiliária — Portal e Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tema moderno 3D — cores de Angola em tons suaves (vermelho coral, carvão, amarelo) ===== */
:root{--bg:#F8F6F4;--panel:#FFFFFF;--panel2:#FBFAF9;--panel3:#F2EFEC;--line:#ECE7E2;--txt:#2B2D33;--mut:#7D7A80;
 --gold:#E5484D;--gold2:#C73A3F;--red:#E5484D;--red-l:#FDE8E8;--sun:#F5BE3B;--sun-l:#FFF4D6;--ink:#2F3138;--ink-l:#EEF0F4;--sea:#3B8FA3;
 --ok:#2E9E6A;--warn:#C98A06;--bad:#E5484D;--info:#3B7FC4;--r:20px;
 --grad:linear-gradient(135deg,#FF7A7E 0%,#E5484D 55%,#D93D50 100%);--grad-sun:linear-gradient(135deg,#FFD976,#F5BE3B);
 --sh1:0 1px 1px rgba(43,45,51,.04),0 2px 4px rgba(43,45,51,.04),0 8px 16px rgba(43,45,51,.05),0 16px 32px rgba(43,45,51,.04);
 --sh2:0 2px 4px rgba(43,45,51,.05),0 10px 24px rgba(43,45,51,.08),0 28px 56px rgba(43,45,51,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(900px 520px at 88% -8%,rgba(255,122,126,.13),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(245,190,59,.12),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(59,143,163,.08),transparent 60%);background-attachment:fixed}
a{color:var(--gold2);cursor:pointer;text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-weight:800;margin:0 0 .4em;line-height:1.15;letter-spacing:-.025em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:16.5px;font-weight:700}
h4{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-top:20px}
.mut{color:var(--mut)}.sm{font-size:12px}.r{text-align:right}.nowrap{white-space:nowrap}
.gold{color:var(--gold2)}
.logo{display:inline-flex;align-items:center;gap:11px;cursor:pointer;text-decoration:none!important;color:var(--txt)}
.logo-ic{flex:none;width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 rgba(0,0,0,.12) inset,0 6px 14px rgba(229,72,77,.35);position:relative}
.logo-ic:after{content:'';position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:5px;background:var(--grad-sun);box-shadow:0 3px 8px rgba(245,190,59,.5);border:2px solid #fff}
.logo .wm{display:flex;flex-direction:column;line-height:1.05}
.logo b{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo small{font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.logo.inv{color:#fff}.logo.inv small{color:#c9cbd3}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--txt);padding:9px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;text-decoration:none!important;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s;box-shadow:0 1px 0 #fff inset,0 2px 0 rgba(43,45,51,.06),0 3px 8px rgba(43,45,51,.05)}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 #fff inset,0 3px 0 rgba(43,45,51,.07),0 8px 16px rgba(43,45,51,.08)}
button:active,.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(43,45,51,.08)}
.btn.gold{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 3px 0 #B8323A,0 8px 18px rgba(229,72,77,.32)}
.btn.gold:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #B8323A,0 12px 24px rgba(229,72,77,.38)}
.btn.gold:active{box-shadow:0 1px 0 #B8323A}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:rgba(43,45,51,.05)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn.wa{background:linear-gradient(135deg,#3ccf7d,#21a35b);border-color:transparent;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 #188049,0 8px 16px rgba(33,163,91,.28)}
.btn.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
input,select,textarea{font:inherit;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-shadow:0 1px 2px rgba(43,45,51,.04) inset;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#F3A2A5;box-shadow:0 0 0 4px rgba(229,72,77,.12)}
input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--mut)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--red);box-shadow:none}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
label.chk{display:flex;gap:7px;align-items:center;color:var(--txt);font-size:13px;margin:0;font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.card{background:var(--panel);border:1px solid rgba(236,231,226,.8);border-radius:var(--r);padding:20px;box-shadow:var(--sh1)}
.card.np{padding:0;overflow:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--panel3);color:var(--mut);white-space:nowrap}
.tag.ok{color:#1f7d52;background:#E3F5EC}.tag.warn{color:#9a6a00;background:var(--sun-l)}.tag.bad{color:#C73A3F;background:var(--red-l)}.tag.info{color:#2c6aa8;background:#E6F0FA}.tag.gold{color:#9a6a00;background:var(--sun-l)}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;background:var(--panel2)}
tr:last-child td{border-bottom:0}
tr:hover td{background:#FDFBFA}
tr.click{cursor:pointer}
.empty{padding:32px;text-align:center;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--txt);background:#fff;font-weight:600;box-shadow:0 2px 0 rgba(43,45,51,.05)}
.chip.on{border-color:transparent;color:#fff;background:var(--ink);box-shadow:0 3px 0 #16171b,0 6px 12px rgba(43,45,51,.2)}
.chip.busy{border-color:#F6C9CB;color:var(--bad);background:var(--red-l);text-decoration:line-through;cursor:not-allowed;box-shadow:none}
.chip.sel{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 3px 0 #B8323A,0 6px 14px rgba(229,72,77,.3)}
.tabs{display:flex;gap:4px;margin:4px 0 18px;overflow:auto;background:var(--panel3);padding:4px;border-radius:14px;width:max-content;max-width:100%}
.tabs a{padding:8px 14px;color:var(--mut);white-space:nowrap;text-decoration:none!important;font-weight:600;border-radius:10px}
.tabs a:hover{color:var(--txt)}
.tabs a.on{color:var(--txt);background:#fff;box-shadow:0 2px 6px rgba(43,45,51,.1)}
.bar{height:9px;border-radius:6px;background:var(--panel3);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05) inset}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:6px}
.alert{border-left:4px solid var(--sun);background:var(--sun-l);padding:10px 13px;border-radius:12px;font-size:13px;margin:6px 0}
.alert.bad{border-color:var(--bad);background:var(--red-l)}
.alert.ok{border-color:var(--ok);background:#E7F6EE}
.note{font-size:12px;color:var(--mut);background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.stripe{height:3px;background:linear-gradient(90deg,#FF8A8D 0 40%,#5A5D66 40% 80%,#FFD166 80%)}
/* ---------- portal ---------- */
.wrap{max-width:1220px;margin:0 auto;padding:0 22px}
.ph{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(236,231,226,.7)}
.ph-in{display:flex;align-items:center;gap:26px;height:72px}
.pnav{display:flex;gap:4px;flex:1;overflow:auto}
.pnav a{color:var(--txt);font-size:13.5px;white-space:nowrap;text-decoration:none!important;font-weight:600;padding:8px 12px;border-radius:10px;opacity:.8}
.pnav a:hover,.pnav a.on{opacity:1;background:rgba(229,72,77,.08);color:var(--gold2)}
.pnav b{color:var(--red)}
.ph-act{display:flex;gap:8px}
.hero{padding:40px 0 30px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.hero h1{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1.02}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero3d{position:relative;height:460px;border-radius:32px;background:radial-gradient(circle at 50% 40%,#fff 0,#FDF3EF 55%,#F8E9E4 100%);box-shadow:var(--sh2),0 1px 0 #fff inset;overflow:hidden;cursor:grab}
.hero3d:active{cursor:grabbing}
.hero3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.hero3d .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero3d .hint{position:absolute;left:16px;bottom:14px;font-size:11.5px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.8);backdrop-filter:blur(6px);padding:5px 10px;border-radius:20px;z-index:2}
.hero3d .float{position:absolute;z-index:2;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;box-shadow:var(--sh1);font-size:12px}
.hero3d .float b{display:block;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:17px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--gold2);margin:0 0 14px;background:#fff;padding:6px 12px;border-radius:20px;box-shadow:var(--sh1)}
.eyebrow:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--grad-sun);box-shadow:0 0 0 3px rgba(245,190,59,.2)}
.search{margin-top:26px;position:relative;z-index:2}
.fin-tabs{display:flex;gap:6px;margin-bottom:14px}
.fin-tabs button{border-radius:30px}
.fin-tabs button.on{background:var(--ink);color:#fff;border-color:transparent;box-shadow:0 3px 0 #16171b,0 8px 16px rgba(43,45,51,.2)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin:34px 0 16px;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;background:var(--panel3);padding:3px;gap:2px}
.seg button{border:0;border-radius:9px;background:transparent;box-shadow:none;padding:7px 12px}
.seg button:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.6)}
.seg button.on{background:#fff;color:var(--txt);box-shadow:0 2px 6px rgba(43,45,51,.12)}
.plist{display:grid;gap:18px;perspective:1400px}
.plist.grelha{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pc{background:var(--panel);border:1px solid rgba(236,231,226,.8);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:360px 1fr;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:var(--sh1);transform-style:preserve-3d;will-change:transform}
.pc:hover{box-shadow:var(--sh2)}
.plist.grelha .pc{grid-template-columns:1fr}
.pc-img{position:relative;cursor:pointer;min-height:230px;background:var(--panel3);margin:10px;border-radius:18px;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;transition:transform .6s}
.pc:hover .pc-img img{transform:scale(1.05)}
.plist.grelha .pc-img{height:220px}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:var(--ink);font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.badge.rs{left:auto;right:12px;background:var(--grad-sun)}
.badge.il{top:auto;bottom:12px;left:auto;right:12px;background:rgba(47,49,56,.66);color:#fff;font-weight:600;font-size:10px;box-shadow:none}
.media{position:absolute;bottom:12px;left:12px;background:rgba(47,49,56,.66);backdrop-filter:blur(6px);color:#fff;font-size:11px;padding:4px 10px;border-radius:12px}
.pc-body{padding:18px 22px 18px 12px;display:flex;flex-direction:column;gap:7px}
.plist.grelha .pc-body{padding:6px 18px 18px}
.pc-body h3{cursor:pointer;margin:0;font-size:18px}
.pc-body h3:hover{color:var(--gold2)}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.icon{background:#fff;border:1px solid var(--line);padding:0;width:38px;height:38px;justify-content:center;font-size:18px;color:var(--mut);border-radius:50%}
.icon.on{color:#fff;background:var(--grad);border-color:transparent}
.loc{margin:0;color:var(--mut);font-size:13px}
.specs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--mut)}
.specs span{background:var(--panel2);border:1px solid var(--line);padding:4px 9px;border-radius:9px}
.specs span b{color:var(--txt);font-weight:700}
.pc-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:12px;gap:10px}
.price{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:24px;font-weight:800;color:var(--txt);letter-spacing:-.03em}
.price small{font-size:13px;color:var(--mut);font-family:Inter;font-weight:500}
.cmp{display:flex;gap:6px;align-items:center;margin:0;font-size:12px;color:var(--mut);cursor:pointer}
.map{position:relative;background:linear-gradient(180deg,#F2F7F8,#E9F1F3);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--sh1)}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin:hover rect{fill:#C73A3F}
.cta{margin:50px auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cta .card{padding:30px;position:relative;overflow:hidden;border:0}
.cta .card:nth-child(1){background:linear-gradient(135deg,#3A3D46,#2B2D33);color:#fff;box-shadow:var(--sh2)}
.cta .card:nth-child(1) .mut{color:#c9cbd3}
.cta .card:nth-child(1):after{content:'';position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border-radius:40px;background:var(--grad);opacity:.35;transform:rotate(25deg)}
.cta .card:nth-child(2){background:linear-gradient(135deg,#FFF6DA,#FFE7A3);box-shadow:var(--sh2)}
.cta .card:nth-child(2):after{content:'';position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:var(--grad-sun);opacity:.45}
.cta .eyebrow{background:rgba(255,255,255,.14);color:inherit;box-shadow:none}
.cta .card:nth-child(2) .eyebrow{background:rgba(255,255,255,.7);color:#9a6a00}
.pf{background:linear-gradient(180deg,#34363E,#2B2D33);color:#c9cbd3;margin-top:60px;padding:36px 0 30px;font-size:13px}
.pf a{color:#FFD166}
.cmpbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(47,49,56,.92);backdrop-filter:blur(10px);color:#fff;border-radius:40px;padding:8px 10px 8px 18px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:0 16px 40px rgba(0,0,0,.25);font-size:13px}
.cmpbar a{color:#FFD166}
.pd{display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
.gal{position:relative}
.gal>img{width:100%;border-radius:20px;display:block;aspect-ratio:3/2;object-fit:cover;background:var(--panel3);box-shadow:var(--sh1)}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:90px;height:62px;object-fit:cover;border-radius:12px;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .15s}
.thumbs img:hover{border-color:var(--red);transform:translateY(-2px)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:700;box-shadow:0 2px 0 rgba(43,45,51,.04)}
.kv small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.formbox{margin-top:18px;padding:18px;border-radius:20px;background:linear-gradient(180deg,#FFF9F8,#FFF);border:1px solid #F7DCDC;box-shadow:var(--sh1)}
.pubform{max-width:860px;margin:36px auto}
/* fotografias */
.dropz{border:2px dashed #F0CFCF;border-radius:18px;padding:18px;text-align:center;background:#FFFAFA;transition:.15s}
.dropz.over{border-color:var(--red);background:var(--red-l);transform:scale(1.01)}
.dropz label{display:inline;color:var(--gold2);cursor:pointer;font-weight:700;font-size:14px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.phi{position:relative;border-radius:14px;overflow:hidden;background:var(--panel3);aspect-ratio:4/3;box-shadow:var(--sh1)}
.phi img{width:100%;height:100%;object-fit:cover;display:block}
.phi .cap{position:absolute;top:6px;left:6px}
.phi .phb{position:absolute;bottom:0;left:0;right:0;display:flex;gap:3px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.phi .phb button{padding:2px 7px;font-size:11px;border-radius:7px}
/* ---------- interno ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.side nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.side nav a{padding:9px 10px;border-radius:12px;color:#4a4c53;text-decoration:none!important;display:flex;gap:10px;align-items:center;font-weight:600}
.side nav a>span:first-child{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel3);box-shadow:0 2px 0 rgba(43,45,51,.06);flex:none}
.side nav a:hover{background:rgba(43,45,51,.04)}
.side nav a.on{background:#fff;color:var(--txt);box-shadow:var(--sh1)}
.side nav a.on>span:first-child{background:var(--grad);color:#fff;box-shadow:0 3px 0 #B8323A,0 6px 12px rgba(229,72,77,.3)}
.side-foot{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px}
.me{font-weight:700}.me small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.main{padding:28px 34px 60px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters input,.filters select{width:auto;min-width:150px}
.kpi{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:var(--sh1);position:relative;overflow:hidden;border:1px solid rgba(236,231,226,.8)}
.kpi:before{content:'';position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:22px;background:var(--grad);opacity:.14;transform:rotate(20deg)}
.kpi:nth-child(3n+2):before{background:var(--grad-sun);opacity:.25}.kpi:nth-child(3n):before{background:linear-gradient(135deg,#5B5E68,#2F3138);opacity:.1}
.kpi small{color:var(--mut);font-size:12px;display:block;font-weight:600}
.kpi b{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:30px;color:var(--txt);font-weight:800;letter-spacing:-.03em}
.kpi .price{font-size:16px!important}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow:auto;padding-bottom:8px}

function drawWM(x,W,H,n1,n2){
 const I=Math.round(Math.max(30,Math.min(W,H*1.5)*0.075)),k=I/40,m=Math.round(I*0.42);
 const f1=Math.round(I*0.5),f2=Math.round(I*0.29),gap=Math.round(I*0.26);
 const FF="'Plus Jakarta Sans','Inter',Arial,sans-serif";
 x.save();
 x.font=`800 ${f1}px ${FF}`;const w1=x.measureText(n1).width;
 x.font=`600 ${f2}px ${FF}`;const w2=n2?x.measureText(n2).width:0;
 const tw=Math.max(w1,w2),gx=W-m-tw-gap-I,gy=H-m-I;
 x.globalAlpha=0.9;
 // ícone
 const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
 x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=10*k;x.shadowOffsetY=3*k;
 let g=x.createLinearGradient(gx,gy,gx+I,gy+I);g.addColorStop(0,'#FF7A7E');g.addColorStop(.55,'#E5484D');g.addColorStop(1,'#D93D50');
 rr(gx,gy,I,I,I*0.32);x.fillStyle=g;x.fill();
 x.shadowColor='transparent';
 const s=I*0.55/24,ox=gx+(I-24*s)/2,oy=gy+(I-24*s)/2-0.5*k;
 x.strokeStyle='#fff';x.lineWidth=2.4*s;x.lineCap='round';x.lineJoin='round';
 x.beginPath();x.moveTo(ox+3*s,oy+11.2*s);x.lineTo(ox+12*s,oy+4*s);x.lineTo(ox+21*s,oy+11.2*s);x.stroke();
 x.beginPath();x.moveTo(ox+5.6*s,oy+9.8*s);x.lineTo(ox+5.6*s,oy+19.5*s);x.lineTo(ox+18.4*s,oy+19.5*s);x.lineTo(ox+18.4*s,oy+9.8*s);x.stroke();
 x.fillStyle='#fff';rr(ox+10*s,oy+13.4*s,4*s,6.1*s,1.2*s);x.fill();
 const q=I*0.32,qx=gx+I-q+3*k,qy=gy+I-q+3*k;
 g=x.createLinearGradient(qx,qy,qx+q,qy+q);g.addColorStop(0,'#FFD976');g.addColorStop(1,'#F5BE3B');
 rr(qx,qy,q,q,q*0.36);x.fillStyle=g;x.fill();x.lineWidth=2*k;x.strokeStyle='#fff';x.stroke();
 // texto
 const tx=gx+I+gap;x.textBaseline='alphabetic';x.fillStyle='#fff';
 x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=8*k;x.shadowOffsetY=1.5*k;
 const th=f1*0.78+(n2?f2*1.25:0),ty=gy+(I-th)/2+f1*0.78;
 x.font=`800 ${f1}px ${FF}`;x.fillText(n1,tx,ty);
 if(n2){x.font=`600 ${f2}px ${FF}`;x.fillText(n2,tx,ty+f2*1.25)}
 x.restore();
}

function readFiles(files,cb,max=1600,q=.8,wm=false){const L=[...files].filter(f=>/^image\//.test(f.type)).slice(0,20);if(!L.length){toast('Escolha ficheiros de imagem (JPG, PNG, WEBP)');return}const out=new Array(L.length);let done=0;const WN=wmNames();
 const go=()=>L.forEach((f,i)=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const cx=c.getContext('2d');cx.drawImage(im,0,0,c.width,c.height);if(wm)try{drawWM(cx,c.width,c.height,WN[0],WN[1])}catch(e){}out[i]=c.toDataURL('image/jpeg',q);if(++done===L.length)cb(out.filter(Boolean))};im.onerror=()=>{if(++done===L.length)cb(out.filter(Boolean))};im.src=e.target.result};r.readAsDataURL(f)});
 wm&&document.fonts&&document.fonts.load?Promise.all([document.fonts.load("800 40px 'Plus Jakarta Sans'"),document.fonts.load("600 20px 'Plus Jakarta Sans'")]).then(go,go):go()}

function readImgsOld(input,cb){const files=[...input.files].slice(0,8);let out=[],n=files.length;if(!n)return;files.forEach(f=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,800/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);out.push(c.toDataURL('image/jpeg',.62));if(out.length===n)cb(out)};im.onerror=()=>{n--;if(out.length===n&&n)cb(out)};im.src=e.target.result};r.readAsDataURL(f)})}

function mapView(L){const provs=[...new Set(L.filter(p=>p.lat!=null).map(p=>p.provincia))];if(!provs.length)return '<div class="card empty">Sem coordenadas para mostrar no mapa.</div>';
 const pv=provs.includes(V.pub.mapProv)?V.pub.mapProv:provs[0];const M=L.filter(p=>p.provincia===pv&&p.lat!=null);
 const W=1000,H=560,pd=70;let la=M.map(p=>p.lat),lo=M.map(p=>p.lng);let minLa=Math.min(...la),maxLa=Math.max(...la),minLo=Math.min(...lo),maxLo=Math.max(...lo);

function score(c,p){const pr=c.pref||{};let s=0,max=0;
 if(pr.finalidade){if(p.finalidade!==pr.finalidade)return 0;max+=25;s+=25}
 if(pr.tipo){max+=15;if(p.tipo===pr.tipo)s+=15}
 const zs=String(pr.zonas||'').split(/[,;]/).map(z=>norm(z.trim())).filter(Boolean);
 if(zs.length){max+=25;const pl=[p.bairro,p.municipio,p.provincia].map(norm);if(zs.some(z=>pl.some(x=>x&&(x.includes(z)||z.includes(x)))))s+=25}
 if(pr.orcMax){max+=25;const v=toAKZ(p.preco,p.moeda),lim=toAKZ(pr.orcMax,pr.moeda||'AKZ'),min=pr.orcMin?toAKZ(pr.orcMin,pr.moeda||'AKZ'):0;if(lim>0){if(v<=lim&&v>=min)s+=25;else if(v<=lim*1.1)s+=12}}
 if(pr.tipologia){max+=10;if(p.tipologia===pr.tipologia)s+=10;else if(p.tipologia&&p.tipologia[0]===pr.tipologia[0]&&Math.abs(parseInt(p.tipologia.slice(1))-parseInt(pr.tipologia.slice(1)))===1)s+=5}
 return max?Math.round(s/max*100):0}
function matches(c,minS=50){return S.props.filter(p=>p.estado==='disponivel'&&p.finalidade!=='procura').map(p=>({p,s:score(c,p)})).filter(x=>x.s>=minS).sort((a,b)=>b.s-a.s)}

 ${F('Tipo','tipo',p.tipo,'select',Object.entries(TIPO))}${F('Finalidade','finalidade',p.finalidade,'select',Object.entries(FIN))}${F('Estado','estado',p.estado,'select',Object.entries(EST).map(([k,[l]])=>[k,l]))}<div style="padding-top:22px">${F('Publicar no site','publicado',p.publicado,'check')}</div>

 <datalist id="dlMun">${muns.map(m=>`<option value="${m}">`).join('')}</datalist><datalist id="dlBai">${bairros.map(m=>`<option value="${m}">`).join('')}</datalist>

 <div class="chips" style="margin-top:10px">${CARACT.map(c=>`<label class="chip ${p.caract.includes(c)?'on':''}" style="display:inline-flex;gap:5px"><input type="checkbox" name="caract:${c}" ${p.caract.includes(c)?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)" style="display:none">${c}</label>`).join('')}</div>

 <select onchange="V.int.fc.orig=this.value;render()"><option value="">Todas as origens</option>${Object.entries(ORIG).map(([k,l])=>`<option value="${k}" ${f.orig===k?'selected':''}>${l}</option>`).join('')}</select></div>
 ${f.view==='funil'?`<div class="kanban">${ETAPAS.map(([k,l],i)=>{const cs=L.filter(c=>c.etapa===k);return `<div class="kcol"><h4>${l}<span class="mut">${cs.length}</span></h4>${cs.map(c=>{const m=c.pref&&c.pref.finalidade?matches(c,60).length:0;return `<div class="kcard"><b onclick="viewCli('${c.id}')">${esc(c.nome)}</b><div class="mut">${c.tipos.map(t=>CTIPOS[t]).join(', ')} · ${ORIG[c.origem]||''}</div><div class="mut">${esc(U(c.corretorId).nome)}${c.proxContacto?' · ↻ '+fd(c.proxContacto):''}</div>${m?`<div class="gold">★ ${m} sugestão(ões)</div>`:''}${w?`<div class="row" style="margin-top:6px;gap:4px">${i>0?`<button class="btn sm ghost" onclick="moveEt('${c.id}',-1)">◀</button>`:''}${i<ETAPAS.length-1?`<button class="btn sm ghost" onclick="moveEt('${c.id}',1)">▶</button>`:''}</div>`:''}</div>`}).join('')}</div>`}).join('')}</div>`
 :`<div class="card np"><table><thead><tr><th>Cliente</th><th>Perfil</th><th>Contacto</th><th>Origem</th><th>Etapa</th><th>Corretor</th><th>Próx. contacto</th><th>Sugestões</th></tr></thead><tbody>${L.map(c=>`<tr class="click" onclick="viewCli('${c.id}')"><td><b>${esc(c.nome)}</b></td><td class="sm">${c.tipos.map(t=>CTIPOS[t]).join(', ')}</td><td class="sm">${esc(c.tel)}<br><span class="mut">${esc(c.email)}</span></td><td>${ORIG[c.origem]||''}</td><td>${tag(ETAPA[c.etapa],c.etapa==='concluido'?'ok':c.etapa==='perdido'?'bad':'gold')}</td><td class="sm">${esc(U(c.corretorId).nome)}</td><td class="sm ${c.proxContacto&&c.proxContacto<today()?'':''}" style="${c.proxContacto&&c.proxContacto<today()?'color:var(--bad)':''}">${fd(c.proxContacto)}</td><td>${c.pref&&c.pref.finalidade?matches(c,60).length:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sem clientes</td></tr>'}</tbody></table></div>`}`}

function viewCli(id){const c=C(id);if(!c.id)return;const w=can('crm','w');const pr=c.pref||{};
 const vis=S.visitas.filter(v=>v.clienteId===id),prs=S.propostas.filter(x=>x.clienteId===id),own=S.props.filter(p=>p.proprietarioId===id),arr=S.arrend.filter(a=>a.inquilinoId===id||a.proprietarioId===id);
 const M=pr.finalidade?matches(c):[];
 modal(esc(c.nome),`<div class="grid g3"><div class="span2"><div class="row">${c.tipos.map(t=>tag(CTIPOS[t],'gold')).join('')}${tag(ETAPA[c.etapa],c.etapa==='concluido'?'ok':'')}${tag('Origem: '+(ORIG[c.origem]||''))}</div>
 <p style="margin-top:10px">📞 ${esc(c.tel)} ${c.tel?`<a class="btn sm wa" href="${waLink(c.tel,'Olá '+c.nome.split(' ')[0]+', ')}" target="_blank" rel="noopener">WhatsApp</a>`:''}<br>✉ ${esc(c.email||'—')}<br><span class="mut sm">NIF: ${esc(c.nif||'—')} · Corretor: ${esc(U(c.corretorId).nome)} · Cliente desde ${fd(c.criado)}</span></p>
 ${pr.finalidade?`<h4>Preferências</h4><p class="sm">${FIN[pr.finalidade]||''} · ${TIPO[pr.tipo]||'qualquer tipo'}${pr.tipologia?' · '+esc(pr.tipologia):''}<br>Zonas: ${esc(pr.zonas||'—')}<br>Orçamento: ${pr.orcMin?fmt(pr.orcMin,pr.moeda)+' a ':'até '}${pr.orcMax?fmt(pr.orcMax,pr.moeda):'—'} · Prazo: ${esc(pr.prazo||'—')}</p>`:''}
 <h4>Imóveis sugeridos automaticamente (${M.length})</h4>${M.slice(0,8).map(({p,s})=>{const ap=(c.apresentados||[]).find(a=>a.propId===p.id);return `<div class="list-item"><div class="row" style="flex-wrap:nowrap"><img class="mini" src="${photos(p)[0]}"><div><a onclick="viewProp('${p.id}')"><b>${esc(p.ref)}</b> ${esc(p.titulo)}</a><br><span class="mut sm">${fmt(p.preco,p.moeda)} · ${esc(p.bairro)}${ap?' · apresentado em '+fd(ap.d):''}</span></div></div><div class="row" style="flex-wrap:nowrap"><span class="score">${s}%</span>${w?`<a class="btn sm wa" href="${waLink(c.tel,`Olá ${c.nome.split(' ')[0]}, temos um imóvel que corresponde ao que procura: ${p.ref} — ${p.titulo}, ${fmt(p.preco,p.moeda)}${p.finalidade==='arrendamento'?'/mês':''}. Quer marcar uma visita?`)}" target="_blank" rel="noopener" onclick="markApres('${id}','${p.id}')">Enviar</a><button class="btn sm" onclick="markApres('${id}','${p.id}');viewCli('${id}')">${ap?'✓':'Apresentado'}</button>`:''}</div></div>`}).join('')||'<p class="mut sm">Sem correspondências (defina preferências ou aguarde novos imóveis).</p>'}
 <h4>Histórico</h4><div class="timeline">${[...vis.map(v=>({d:v.data,t:`Visita ${VEST[v.estado][0].toLowerCase()} — ${P(v.propId).ref}${v.interesse?' · interesse '+v.interesse+'/5':''}${v.resultado?' · '+v.resultado:''}`})),...prs.map(x=>({d:x.criado,t:`Proposta ${fmt(x.valor,x.moeda)} — ${P(x.propId).ref} (${PEST[x.estado][0]})`})),...(c.apresentados||[]).map(a=>({d:a.d,t:'Imóvel apresentado — '+P(a.propId).ref})),...own.map(p=>({d:p.criado,t:'Imóvel angariado — '+p.ref+' ('+EST[p.estado][0]+')'})),...arr.map(a=>({d:a.inicio,t:'Contrato de arrendamento — '+P(a.propId).ref}))].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<div><span class="mut sm">${fd(e.d)}</span><br>${esc(e.t)}</div>`).join('')||'<p class="mut sm">Sem histórico.</p>'}</div></div>
 <div><h4 style="margin-top:0">Próximo contacto</h4>${w?`<input type="date" value="${c.proxContacto||''}" onchange="C('${id}').proxContacto=this.value;log('Próximo contacto de ${esc(c.nome)} → '+this.value);render()">`:fd(c.proxContacto)}
 <h4>Tarefas</h4>${c.tarefas.map(t=>`<label class="chk" style="margin:6px 0"><input type="checkbox" ${t.feito?'checked':''} ${w?'':'disabled'} onchange="tTask('${id}','${t.id}',this.checked)"> <span style="${t.feito?'text-decoration:line-through;opacity:.5':''}">${fd(t.d)} — ${esc(t.t)}</span></label>`).join('')||'<p class="mut sm">—</p>'}
 ${w?`<div id="ntask" class="grid" style="margin-top:6px"><input name="t" placeholder="Nova tarefa"><div class="row" style="flex-wrap:nowrap"><input type="date" name="d" value="${addD(today(),1)}"><button class="btn sm" onclick="addTask('${id}')">+</button></div></div>`:''}
 <h4>Notas</h4>${w?`<div id="nnota"><textarea name="t" rows="2" placeholder="Registar contacto, chamada, observação…"></textarea><button class="btn sm" style="margin-top:6px" onclick="addNota('${id}')">Adicionar nota</button></div>`:''}
 ${c.notas.map(n=>`<div class="note" style="margin-top:8px"><span class="sm">${fdt(n.d)} · ${esc(n.u||'')}</span><br>${esc(n.t)}</div>`).join('')}</div></div>`,
 w?`${window.KIANDA_API?`<button class="btn" onclick="clientInvite('${id}')">🔑 Acesso área reservada</button>`:''}<button class="btn" onclick="editVisita(null,{clienteId:'${id}'})">Agendar visita</button><button class="btn" onclick="editProposta({clienteId:'${id}'})">Registar proposta</button><button class="btn gold" onclick="editCli('${id}')">Editar</button>`:'')}
function markApres(cid,pid){const c=C(cid);c.apresentados=c.apresentados||[];if(!c.apresentados.some(a=>a.propId===pid)){c.apresentados.push({propId:pid,d:today()});log(`Imóvel ${P(pid).ref} apresentado a ${c.nome}`)}}
function tTask(cid,tid,v){const t=C(cid).tarefas.find(t=>t.id===tid);t.feito=v;log(`Tarefa ${v?'concluída':'reaberta'}: ${t.t}`);viewCli(cid);render()}
function addTask(cid){const d=fd2('#ntask');if(!d.t)return;C(cid).tarefas.push({id:uid('t'),d:d.d||today(),t:d.t,feito:false});log(`Tarefa criada para ${C(cid).nome}: ${d.t}`);viewCli(cid);render()}
function addNota(cid){const d=fd2('#nnota');if(!d.t)return;C(cid).notas.unshift({d:new Date().toISOString().slice(0,16),t:d.t,u:me().nome});log(`Nota registada em ${C(cid).nome}`);viewCli(cid)}
function editCli(id){const c=id?C(id):{tipos:['comprador'],origem:'site',etapa:'novo',corretorId:me().funcao==='corretor'?me().id:autoCorretor(),pref:{}};const pr=c.pref||{};
 modal(id?'Editar cliente':'Novo cliente',`<div id="fcli"><div class="grid g3">${F('Nome *','nome',c.nome)}${F('Telefone / WhatsApp','tel',c.tel)}${F('E-mail','email',c.email,'email')}${F('NIF','nif',c.nif)}${F('Origem do contacto','origem',c.origem,'select',Object.entries(ORIG))}${F('Etapa','etapa',c.etapa,'select',ETAPAS)}${F('Corretor responsável','corretorId',c.corretorId,'select',optsUsers(['corretor','admin']))}${F('Próximo contacto','proxContacto',c.proxContacto,'date')}</div>
 <h4>Perfil</h4><div class="row">${Object.entries(CTIPOS).map(([k,l])=>`<label class="chk"><input type="checkbox" name="tipos:${k}" ${c.tipos.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
 <h4>Preferências (para sugestões automáticas)</h4><div class="grid g4">${F('Finalidade','p_finalidade',pr.finalidade,'select',[['','—'],['venda','Comprar'],['arrendamento','Arrendar']])}${F('Tipo','p_tipo',pr.tipo,'select',[['','Qualquer'],...Object.entries(TIPO)])}${F('Tipologia','p_tipologia',pr.tipologia,'select',['',...TIPOLOGIAS])}${F('Prazo','p_prazo',pr.prazo,'select',['','Imediato','Até 3 meses','Até 6 meses','Mais de 6 meses'])}
 <div class="span2">${F('Zonas (separadas por vírgula)','p_zonas',pr.zonas)}</div>${F('Orçamento mínimo','p_orcMin',pr.orcMin,'number')}${F('Orçamento máximo','p_orcMax',pr.orcMax,'number')}${F('Moeda','p_moeda',pr.moeda||'AKZ','select',MOEDAS)}</div></div>`,
 `<button class="btn ghost" onclick="${id?`viewCli('${id}')`:'closeModal()'}">Cancelar</button><button class="btn gold" onclick="saveCli('${id||''}')">Guardar</button>`)}
function saveCli(id){const d=fd2('#fcli');if(!d.nome){toast('Indique o nome');return}const pref={};Object.keys(d).filter(k=>k.startsWith('p_')).forEach(k=>{pref[k.slice(2)]=d[k];delete d[k]});d.tipos=d.tipos&&d.tipos.length?d.tipos:['comprador'];d.pref=pref;
 if(id){Object.assign(C(id),d);log(`Cliente atualizado: ${d.nome}`);save();viewCli(id)}else{const c=Object.assign({id:uid('c'),notas:[],tarefas:[],apresentados:[],favs:[],criado:today()},d);S.clientes.push(c);log(`Cliente criado: ${c.nome}`);save();viewCli(c.id)}render()}

/* ---------- VISITAS ---------- */
const VIS_DUR=60; // duração considerada de cada visita (minutos)
const hm=h=>{const[a,b]=String(h||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const nowHM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function visConf(v,excl){if(!v.data||!v.hora)return[];return S.visitas.filter(x=>x.id!==excl&&x.estado!=='cancelada'&&x.data===v.data&&Math.abs(hm(x.hora)-hm(v.hora))<VIS_DUR&&((v.corretorId&&x.corretorId===v.corretorId)||(v.propId&&x.propId===v.propId)||(v.clienteId&&x.clienteId===v.clienteId)))}
function confWhy(x,v){return [x.corretorId===v.corretorId?'mesmo corretor':'',x.propId===v.propId?'mesmo imóvel':'',x.clienteId===v.clienteId?'mesmo cliente':''].filter(Boolean).join(', ')}
const SLOTS=(()=>{const a=[];for(let m=8*60;m<=18*60;m+=30)a.push(pad(Math.floor(m/60))+':'+pad(m%60));return a})();
const slotPast=(d,h)=>d<today()||(d===today()&&hm(h)<=nowHM());
function firstFree(v,excl){return SLOTS.find(h=>!slotPast(v.data,h)&&!visConf({...v,hora:h},excl).length)||''}
function slotsHTML(v,excl,pub,target){return `<div class="chips">${SLOTS.map(h=>{const c=visConf({...v,hora:h},excl);const past=slotPast(v.data,h);const busy=c.length>0||past;
 const tip=past?'Hora já passou':pub?'Horário ocupado':c.map(x=>x.hora+' '+P(x.propId).ref+' · '+C(x.clienteId).nome+' ('+confWhy(x,{...v,hora:h})+')').join('; ');
 return `<button type="button" class="chip ${v.hora===h?'sel':''} ${busy?'busy':''}" ${busy?`title="${esc(tip)}"`:''} ${busy&&pub?'disabled':`onclick="setHora('${target}','${h}')"`}>${h}</button>`}).join('')}</div>`}
function setHora(target,h){const el=document.querySelector(target+' [name=hora]');if(el)el.value=h;target==='#fvis'?checkVis():checkPub()}
function checkVis(){const box=$('#visCheck');if(!box)return;const d=fd2('#fvis');const excl=box.dataset.excl||'';const c=visConf(d,excl);
 const day=S.visitas.filter(x=>x.id!==excl&&x.estado!=='cancelada'&&x.data===d.data&&(x.corretorId===d.corretorId||x.propId===d.propId||x.clienteId===d.clienteId)).sort((a,b)=>a.hora.localeCompare(b.hora));
 box.innerHTML=(c.length?`<div class="alert bad" style="margin-top:12px"><b>⚠ Já existe visita marcada para esta hora</b>${c.map(x=>`<br>${x.hora} — ${esc(P(x.propId).ref)} com ${esc(C(x.clienteId).nome)} · ${esc(U(x.corretorId).nome)} <span class="mut">(${confWhy(x,d)})</span>`).join('')}<div class="row" style="margin-top:8px"><span class="sm">Escolha uma hora livre abaixo ou</span><button class="btn sm danger" onclick="saveVisita('${excl}',true)">Marcar mesmo assim</button></div></div>`
  :(d.data&&d.hora?(slotPast(d.data,d.hora)&&!excl?`<div class="alert" style="margin-top:12px">Atenção: a data/hora escolhida já passou.</div>`:`<div class="alert ok" style="margin-top:12px">✓ Horário livre${d.corretorId?' para '+esc(U(d.corretorId).nome):''}${d.propId?' · imóvel '+esc(P(d.propId).ref):''}</div>`):''))
  +(d.data?`<label style="margin-top:12px">Horários de ${fd(d.data)} — a vermelho os ocupados (corretor, imóvel ou cliente)</label>${slotsHTML(d,excl,false,'#fvis')}`:'')
  +(day.length?`<p class="note" style="margin-top:10px"><b>Agenda deste dia:</b> ${day.map(x=>`${x.hora} ${esc(P(x.propId).ref)} · ${esc(C(x.clienteId).nome)} (${esc(U(x.corretorId).nome.split(' ')[0])})`).join(' · ')}</p>`:'')}

 L.sort((a,b)=>(f.per==='passadas'?-1:1)*(a.data+a.hora).localeCompare(b.data+b.hora));const w=can('visitas','w');
 const groups={};L.forEach(v=>(groups[v.data]=groups[v.data]||[]).push(v));

 `<div class="filters">${mineToggle()}<div class="seg">${[['proximas','Próximas'],['hoje','Hoje'],['passadas','Passadas'],['todas','Todas']].map(([k,l])=>`<button class="${f.per===k?'on':''}" onclick="V.int.fv.per='${k}';render()">${l}</button>`).join('')}</div>
 <select onchange="V.int.fv.est=this.value;render()"><option value="">Todos os estados</option>${Object.entries(VEST).map(([k,[l]])=>`<option value="${k}" ${f.est===k?'selected':''}>${l}</option>`).join('')}</select>
 ${me().funcao!=='corretor'?`<select onchange="V.int.fv.cor=this.value;render()"><option value="">Todos os corretores</option>${S.equipa.filter(u=>u.funcao==='corretor').map(u=>`<option value="${u.id}" ${f.cor===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>`:''}</div>
 ${Object.keys(groups).length?Object.entries(groups).map(([d,vs])=>`<h4>${d===T?'Hoje · ':''}${new Date(d+'T12:00').toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</h4><div class="card np"><table><tbody>${vs.map(v=>{const p=P(v.propId),c=C(v.clienteId);return `<tr><td style="width:70px"><b>${v.hora}</b></td><td><a onclick="viewProp('${p.id}')"><b>${esc(p.ref)}</b> ${esc(p.titulo)}</a><br><span class="mut sm">${esc(p.bairro)}, ${esc(p.municipio)}</span></td><td><a onclick="viewCli('${c.id}')">${esc(c.nome)}</a><br><span class="mut sm">${esc(c.tel)}</span></td><td class="sm">${esc(U(v.corretorId).nome)}</td><td>${tag(...VEST[v.estado])}${v.lembrete?' <span class="tag ok">lembrete enviado</span>':''}${v.interesse?`<br><span class="gold sm">${'★'.repeat(v.interesse)}${'☆'.repeat(5-v.interesse)}</span>`:''}</td>
 <td class="r">${w?`<div class="row" style="justify-content:flex-end;gap:4px">${['pedido','agendada'].includes(v.estado)?`<button class="btn sm" onclick="setVis('${v.id}','confirmada')">Confirmar</button>`:''}${['agendada','confirmada','pedido'].includes(v.estado)?`<a class="btn sm wa" href="${waLink(c.tel,`Olá ${c.nome.split(' ')[0]}, lembramos a visita ao imóvel ${p.ref} (${p.bairro}) em ${fd(v.data)} às ${v.hora}, com ${U(v.corretorId).nome}. Até já!`)}" target="_blank" rel="noopener" onclick="S.visitas.find(x=>x.id==='${v.id}').lembrete=true;log('Lembrete enviado — visita ${p.ref}');setTimeout(render,300)">Lembrete</a><button class="btn sm" onclick="resultVisita('${v.id}')">Resultado</button>`:''}${v.estado==='realizada'?`<button class="btn sm ghost" onclick="resultVisita('${v.id}')">Ver/editar</button>`:''}<button class="btn sm ghost" onclick="editVisita('${v.id}')">✎</button></div>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join(''):'<div class="card empty">Sem visitas neste período.</div>'}`}

 ${['aceite','reservado'].includes(x.estado)?`<button class="btn gold" onclick="propAct('${id}','contrato')">Fechar negócio</button>`:''}
 ${['recusada','expirada'].includes(x.estado)?`<button class="btn" onclick="propAct('${id}','pendente')">Reabrir</button>`:''}</div>`:''}

 if(a==='reservado'||a==='prolongar'){const d=$('#resAte').value;if(!d){toast('Indique a validade da reserva');return}x.reservaAte=d;x.estado='reservado';p.estado='reservado';S.propostas.filter(y=>y.propId===p.id&&y.id!==id&&['pendente','contraproposta'].includes(y.estado)).forEach(y=>y.historico.push({d:today(),autor:'corretor',valor:y.valor,nota:'Imóvel reservado por outro cliente'}))}

 else if(a==='aceite'){x.estado='aceite';x.historico.push({d:today(),autor:'proprietario',valor:x.valor,nota:'Proposta aceite'})}

function pgFinancas(){const f=V.int.ff,T=today(),u=me();const own=u.funcao==='corretor';const w=can('financas','w');
 const shareOf=(x)=>own?((x.split||[]).find(s=>s.quem===u.id)||{pct:0}).pct/100:1;
 const neg=S.propostas.filter(x=>x.estado==='contrato'&&shareOf(x)>0);const pipe=S.propostas.filter(x=>['aceite','reservado'].includes(x.estado)&&shareOf(x)>0);
 const comT=byCur(neg,x=>comValor(x)*shareOf(x),x=>x.moeda),recT=byCur(neg,x=>(+x.recebido||0)*shareOf(x),x=>x.moeda);const porRec={};for(const k of new Set([...Object.keys(comT),...Object.keys(recT)]))porRec[k]=(comT[k]||0)-(recT[k]||0);
 const prevT=byCur(pipe,x=>comValor(x)*shareOf(x),x=>x.moeda);

 const custT=byCur(S.custos,k=>k.v,k=>k.moeda);
 const tabs=[['comissoes','Comissões por negócio'],['corretores','Por corretor / parceiro'],...(own?[]:[['gestao','Comissões de gestão'],['custos','Custos de divulgação'],['indicadores','Indicadores'],['exportar','Exportar / Faturação']])];
 let body='';
 if(f.tab==='comissoes')body=`<div class="card np"><table><thead><tr><th>Data</th><th>Negócio</th><th>Cliente</th><th class="r">Valor</th><th class="r">%</th><th class="r">Comissão${own?' (minha parte)':''}</th><th class="r">Recebido</th><th class="r">Por receber</th></tr></thead><tbody>${[...neg,...pipe].sort((a,b)=>(b.fechadoEm||b.criado||'').localeCompare(a.fechadoEm||a.criado||'')).map(x=>{const s=shareOf(x),cv=comValor(x)*s,rc=(x.estado==='contrato'?(+x.recebido||0):0)*s;return `<tr class="click" onclick="viewProposta('${x.id}')"><td>${fd(x.fechadoEm||x.criado)}</td><td><b>${esc(P(x.propId).ref)}</b> ${tag(PEST[x.estado][0],x.estado==='contrato'?'ok':'warn')}<br><span class="mut sm">${FIN[P(x.propId).finalidade]}</span></td><td>${esc(C(x.clienteId).nome)}</td><td class="r nowrap">${fmt(x.valor,x.moeda)}</td><td class="r">${x.comissaoPct}%</td><td class="r nowrap">${fmt(cv,x.moeda)}</td><td class="r nowrap">${fmt(rc,x.moeda)}</td><td class="r nowrap">${x.estado==='contrato'?fmt(cv-rc,x.moeda):'<span class="mut">previsto</span>'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Sem negócios</td></tr>'}</tbody></table></div>`;
 if(f.tab==='corretores'){const people={};[...neg,...pipe].forEach(x=>(x.split||[]).forEach(s=>{if(own&&s.quem!==u.id)return;const k=s.quem==='ext'?'ext:'+(s.nome||'Parceiro'):s.quem;people[k]=people[k]||{prev:{},fech:{},rec:{}};const v=comValor(x)*(+s.pct||0)/100;const o=people[k];if(x.estado==='contrato'){o.fech[x.moeda]=(o.fech[x.moeda]||0)+v;o.rec[x.moeda]=(o.rec[x.moeda]||0)+(+x.recebido||0)*(+s.pct||0)/100}else o.prev[x.moeda]=(o.prev[x.moeda]||0)+v}));
  body=`<div class="card np"><table><thead><tr><th>Corretor / parceiro</th><th class="r">Negócios fechados</th><th class="r">Recebido pela imobiliária</th><th class="r">Previsto (pipeline)</th></tr></thead><tbody>${Object.entries(people).map(([k,o])=>`<tr><td><b>${esc(k.startsWith('ext:')?k.slice(4):U(k).nome)}</b>${k.startsWith('ext:')?' '+tag('Parceiro'):''}</td><td class="r">${curStr(o.fech)}</td><td class="r">${curStr(o.rec)}</td><td class="r">${curStr(o.prev)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sem dados</td></tr>'}</tbody></table></div>`}
 if(f.tab==='gestao')body=`<div class="card np"><table><thead><tr><th>Contrato</th><th>Proprietário</th><th class="r">%</th><th class="r">Rendas recebidas ${T.slice(0,4)}</th><th class="r">Comissão de gestão</th></tr></thead><tbody>${S.arrend.filter(a=>a.gestao).map(a=>{const r=a.pagamentos.filter(p=>p.mes.slice(0,4)===T.slice(0,4)).reduce((s,p)=>s+(+p.v||0),0);return `<tr><td><b>${esc(P(a.propId).ref)}</b></td><td>${esc(C(a.proprietarioId).nome)}</td><td class="r">${a.comGestao}%</td><td class="r">${fmt(r,a.moeda)}</td><td class="r">${fmt(r*a.comGestao/100,a.moeda)}</td></tr>`}).join('')}</tbody></table></div>`;
 if(f.tab==='custos')body=`<div class="filters">${w?`<button class="btn gold" onclick="custoModal()">+ Registar custo</button>`:''}</div><div class="card np"><table><thead><tr><th>Data</th><th>Imóvel</th><th>Descrição</th><th class="r">Valor</th><th></th></tr></thead><tbody>${[...S.custos].sort((a,b)=>b.d.localeCompare(a.d)).map(k=>`<tr><td>${fd(k.d)}</td><td>${esc(P(k.propId).ref)}</td><td>${esc(k.desc)}</td><td class="r">${fmt(k.v,k.moeda)}</td><td class="r">${w?`<button class="btn sm ghost danger" onclick="S.custos=S.custos.filter(x=>x.id!=='${k.id}');log('Custo de divulgação removido');render()">✕</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  <h4>Por imóvel</h4><div class="card np"><table><tbody>${[...new Set(S.custos.map(k=>k.propId))].map(pid=>`<tr><td><b>${esc(P(pid).ref)}</b> ${esc(P(pid).titulo)}</td><td class="r">${curStr(byCur(S.custos.filter(k=>k.propId===pid),k=>k.v,k=>k.moeda))}</td><td>${estTag(P(pid).estado)}</td></tr>`).join('')}</tbody></table></div>`;
 if(f.tab==='indicadores'){const ano=T.slice(0,4);const ps=S.props.filter(p=>p.finalidade!=='procura');const vend=ps.filter(p=>p.vendidoEm&&p.criado);
  const byTipo=Object.entries(TIPO).map(([k,l])=>[l,ps.filter(p=>p.tipo===k&&p.estado==='disponivel').length]);
  const mes=Array.from({length:6},(_,i)=>addM(T.slice(0,7),i-5));
  body=`<div class="grid g4" style="margin-bottom:14px">${[['Imóveis disponíveis',ps.filter(p=>p.estado==='disponivel').length],['Visitas realizadas '+ano,S.visitas.filter(v=>v.estado==='realizada'&&v.data.slice(0,4)===ano).length],['Propostas '+ano,S.propostas.filter(x=>(x.criado||'').slice(0,4)===ano).length],['Negócios fechados '+ano,S.propostas.filter(x=>x.estado==='contrato'&&(x.fechadoEm||'').slice(0,4)===ano).length],['Tempo médio até fechar',vend.length?Math.round(vend.reduce((a,p)=>a+diffD(p.criado,p.vendidoEm),0)/vend.length)+' dias':'—'],['Taxa visita → proposta',(()=>{const v=S.visitas.filter(v=>v.estado==='realizada').length;return v?Math.round(S.propostas.length/v*100)+'%':'—'})()],['Clientes ativos',S.clientes.filter(c=>!['concluido','perdido'].includes(c.etapa)).length],['Imóveis em preparação',ps.filter(p=>p.estado==='em_preparacao').length]].map(([l,v])=>`<div class="kpi"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
  <div class="grid g2"><div class="card"><h3>Disponíveis por tipo</h3>${bars(byTipo,Math.max(1,...byTipo.map(x=>x[1])))}</div><div class="card"><h3>Atividade dos últimos 6 meses</h3><table><thead><tr><th>Mês</th><th class="r">Novos contactos</th><th class="r">Visitas</th><th class="r">Propostas</th><th class="r">Fechados</th></tr></thead><tbody>${mes.map(m=>`<tr><td>${fmes(m)}</td><td class="r">${S.clientes.filter(c=>(c.criado||'').slice(0,7)===m).length}</td><td class="r">${S.visitas.filter(v=>v.data.slice(0,7)===m&&v.estado==='realizada').length}</td><td class="r">${S.propostas.filter(x=>(x.criado||'').slice(0,7)===m).length}</td><td class="r">${S.propostas.filter(x=>x.estado==='contrato'&&(x.fechadoEm||'').slice(0,7)===m).length}</td></tr>`).join('')}</tbody></table></div></div>`}
 if(f.tab==='exportar')body=`<div class="grid g3">${[['Imóveis','expImoveis'],['Clientes','expClientes'],['Comissões','expComissoes'],['Rendas e pagamentos','expRendas'],['Despesas','expDespesas'],['Faturação (comissões a faturar)','expFaturacao']].map(([l,fn])=>`<div class="card"><h3>${l}</h3><p class="mut sm">CSV com separador “;”, pronto a abrir no Excel.</p><button class="btn" onclick="showText('${l}',${fn}())">Exportar</button></div>`).join('')}</div><p class="note" style="margin-top:14px">O ficheiro de faturação inclui cliente, NIF, descrição, valor e moeda de cada comissão por faturar, para importar no sistema de faturação. Numa versão em servidor, a ligação pode ser feita diretamente por API.</p>`;
 return head('Gestão financeira e resultados','',own?'Visão da sua carteira':'Totais sempre separados por moeda')+
 `<div class="grid g4" style="margin-bottom:14px"><div class="kpi"><small>Comissões de negócios fechados</small><div class="price" style="font-size:16px">${curStr(comT)}</div></div><div class="kpi"><small>Recebido</small><div class="price" style="font-size:16px">${curStr(recT)}</div></div><div class="kpi"><small>Por receber</small><div class="price" style="font-size:16px">${curStr(porRec)}</div></div><div class="kpi"><small>Previsto (aceites e reservas)</small><div class="price" style="font-size:16px">${curStr(prevT)}</div></div>
 ${own?'':`<div class="kpi"><small>Comissões de gestão ${T.slice(0,4)}</small><div class="price" style="font-size:16px">${curStr(gest)}</div></div><div class="kpi"><small>Custos de divulgação</small><div class="price" style="font-size:16px">${curStr(custT)}</div></div>`}</div>
 <div class="tabs">${tabs.map(([k,l])=>`<a class="${f.tab===k?'on':''}" onclick="V.int.ff.tab='${k}';render()">${l}</a>`).join('')}</div>${body}`}

 if(f.tab==='permissoes')body=`<div class="card np"><table><thead><tr><th>Módulo</th>${Object.values(ROLES).map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${MODS.map(([k,l])=>`<tr><td>${l}</td>${Object.keys(ROLES).map(r=>{const v=PERM[r][k];return `<td>${v==='rw'?tag('Ver e editar','ok'):v==='r'?tag('Só consulta','info'):'<span class="mut">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>

  <h4>Câmbio de referência (indicativo — atualize regularmente)</h4><p class="mut sm">Usado apenas para comparar preços em moedas diferentes na pesquisa e nas sugestões automáticas. Os valores e totais financeiros nunca são convertidos: cada preço mantém a sua moeda e os totais são apresentados por moeda.</p><div class="grid g3">${F('1 USD = Kz','cUSD',c.cambio.USD,'number')}${F('1 EUR = Kz','cEUR',c.cambio.EUR,'number')}</div><button class="btn gold" style="margin-top:12px" onclick="saveCfg()">Guardar configurações</button></div>`}
 return head('Equipa & Segurança')+`<div class="tabs">${tabs.map(([k,l])=>`<a class="${f.tab===k?'on':''}" onclick="V.int.fe.tab='${k}';render()">${l}</a>`).join('')}</div>${body}`}
function saveCfg(){const d=fd2('#fcfg');Object.assign(S.cfg,{empresa:d.empresa,whatsapp:d.whatsapp,email:d.email,nif:d.nif,comVenda:d.comVenda,comArr:d.comArr,cambio:{USD:d.cUSD||0,EUR:d.cEUR||0}});log('Configurações atualizadas');render();toast('Configurações guardadas')}
function editUser(id){const u=id?U(id):{funcao:'corretor',ativo:true,mfa:true};modal(id?'Editar utilizador':'Novo utilizador',`<div id="fusr" class="grid g2">${F('Nome','nome',u.nome)}${F('Função','funcao',u.funcao,'select',Object.entries(ROLES))}${F('E-mail','email',u.email,'email')}${F('Telefone','tel',u.tel)}${window.KIANDA_API?'':F('Autenticação reforçada (2FA)','mfa',u.mfa,'check')}${F('Utilizador ativo','ativo',u.ativo,'check')}</div>${window.KIANDA_API&&id?userAccessBox(id):''}${id===V.int.user?'<p class="note" style="margin-top:10px">Está a editar o seu próprio utilizador.</p>':''}`,`<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn gold" onclick="saveUser('${id||''}')">Guardar</button>`,'narrow')}
function saveUser(id){const d=fd2('#fusr');if(!d.nome){toast('Indique o nome');return}if(id===V.int.user&&(!d.ativo||d.funcao!=='admin')&&!S.equipa.some(u=>u.id!==id&&u.ativo&&u.funcao==='admin')){toast('Tem de existir pelo menos um administrador ativo.');return}
 if(id){const u=U(id);const ch=[];if(u.funcao!==d.funcao)ch.push('função '+ROLES[u.funcao]+' → '+ROLES[d.funcao]);if(u.ativo!==d.ativo)ch.push(d.ativo?'ativado':'desativado');Object.assign(u,d);log(`Utilizador ${d.nome} atualizado${ch.length?' ('+ch.join(', ')+')':''}`)}else{S.equipa.push({id:uid('u'),...d});log(`Utilizador criado: ${d.nome} (${ROLES[d.funcao]})`)}closeModal();render()}
function restoreData(o){if(!o||!o.props||!o.clientes||!o.equipa){toast('Ficheiro inválido');return}S=o;log('Dados recuperados a partir de cópia de segurança');save();V.int.user=S.equipa.some(u=>u.id===V.int.user)?V.int.user:null;render();toast('Dados recuperados')}
function restoreFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{restoreData(JSON.parse(e.target.result))}catch(x){toast('Ficheiro inválido')}};r.readAsText(f)}
function restoreTxt(){try{restoreData(JSON.parse($('#rsTxt').value))}catch(x){toast('Texto inválido')}}
function resetDemo(){Object.keys(IMG).forEach(idbDel);const u=V.int.user;S=seed();S.versao=1;migrate();V.int.user=u;closeModal();render();toast('Dados de demonstração repostos')}

/* =====================================================================
   ÁREA RESERVADA (clientes)
   ===================================================================== */
function rReservada(){if(!V.res.cli)return resLogin();const c=C(V.res.cli);
 const isOwner=S.props.some(p=>p.proprietarioId===c.id&&p.finalidade!=='procura');const gest=S.arrend.filter(a=>a.gestao&&a.proprietarioId===c.id);const ten=S.arrend.filter(a=>a.inquilinoId===c.id);
 const tabs=[['interesse','Os meus favoritos e sugestões'],...(isOwner?[['proprietario','Os meus imóveis']]:[]),...(gest.length?[['gestao','Gestão do arrendamento']]:[]),...(ten.length?[['arrendatario','O meu arrendamento']]:[])];
 if(!tabs.some(t=>t[0]===V.res.tab))V.res.tab=isOwner?'proprietario':ten.length?'arrendatario':'interesse';
 const cor=U(c.corretorId);let body='';const T=today();
 if(V.res.tab==='interesse'){const favs=c.favs.map(P).filter(p=>p.id);const M=c.pref&&c.pref.finalidade?matches(c,60).slice(0,6):[];const vis=S.visitas.filter(v=>v.clienteId===c.id).sort((a,b)=>b.data.localeCompare(a.data));const prs=S.propostas.filter(x=>x.clienteId===c.id);
  body=`<h2>Favoritos (${favs.length})</h2>${favs.length?`<div class="plist">${favs.map(propCard).join('')}</div>`:'<p class="mut">Ainda não tem favoritos. <a onclick="go(\'portal\',\'home\')">Ver imóveis</a></p>'}
  <h2 style="margin-top:26px">Sugeridos para si</h2>${M.length?`<div class="plist grelha">${M.map(m=>propCard(m.p)).join('')}</div>`:'<p class="mut">Indique as suas preferências ao seu corretor para receber sugestões.</p>'}
  <div class="grid g2" style="margin-top:26px"><div class="card"><h3>As minhas visitas</h3>${vis.map(v=>`<div class="list-item"><div><b>${fd(v.data)} ${v.hora}</b> · ${esc(P(v.propId).titulo)}<br><span class="mut sm">${esc(U(v.corretorId).nome)}</span></div>${tag(...VEST[v.estado])}</div>`).join('')||'<p class="mut">Sem visitas.</p>'}</div>
  <div class="card"><h3>As minhas propostas</h3>${prs.map(x=>`<div class="list-item"><div><b>${esc(P(x.propId).titulo)}</b><br><span class="mut sm">${fmt(x.valor,x.moeda)}${x.reservaAte&&x.estado==='reservado'?' · reserva até '+fd(x.reservaAte):''}</span></div>${tag(...PEST[x.estado])}</div>${x.estado==='reservado'||x.estado==='contrato'?`<p class="sm mut" style="margin:0 0 8px">Documentos em falta: ${x.docs.filter(d=>!d.ok).map(d=>esc(d.nome)).join(', ')||'nenhum'}</p>`:''}`).join('')||'<p class="mut">Sem propostas.</p>'}</div></div>`}
 if(V.res.tab==='proprietario'){const ps=S.props.filter(p=>p.proprietarioId===c.id&&p.finalidade!=='procura');
  body=`<div class="grid">${ps.map(p=>{const vis=S.visitas.filter(v=>v.propId===p.id);const prs=S.propostas.filter(x=>x.propId===p.id);return `<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><img src="${photos(p)[0]}" style="width:180px;border-radius:10px"><div style="flex:1"><div class="row">${estTag(p.estado)}${p.publicado?tag('Publicado no site','ok'):tag('Não publicado')}</div><h3 style="margin-top:6px">${esc(p.titulo)}</h3><p class="mut sm">${esc(p.ref)} · ${fmt(p.preco,p.moeda)}${p.finalidade==='arrendamento'?'/mês':''} · ${diffD(p.criado,p.vendidoEm||T)} dias em carteira</p>
   <div class="grid g3"><div class="kpi"><small>Visitas realizadas</small><b>${vis.filter(v=>v.estado==='realizada').length}</b></div><div class="kpi"><small>Visitas marcadas</small><b>${vis.filter(v=>['agendada','confirmada','pedido'].includes(v.estado)&&v.data>=T).length}</b></div><div class="kpi"><small>Propostas</small><b>${prs.length}</b></div></div></div></div>
   ${prs.length?`<h4>Propostas recebidas</h4><table><tbody>${prs.map(x=>`<tr><td>${fd(x.criado)}</td><td>${fmt(x.valor,x.moeda)}</td><td>${tag(...PEST[x.estado])}</td><td class="sm mut">${esc(x.historico.slice(-1)[0].nota||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${vis.filter(v=>v.estado==='realizada'&&v.resultado).length?`<h4>Feedback das visitas</h4>${vis.filter(v=>v.estado==='realizada'&&v.resultado).map(v=>`<p class="sm">${fd(v.data)} · interesse ${v.interesse}/5 — ${esc(v.resultado)}</p>`).join('')}`:''}</div>`}).join('')}</div>`}
 if(V.res.tab==='gestao'){const mes=V.res.mes||T.slice(0,7);const ms=S.manut.filter(m=>gest.some(a=>a.propId===m.propId));
  body=`<div class="grid g2">${gest.map(a=>`<div class="card"><h3>${esc(P(a.propId).titulo)}</h3><p class="mut sm">Arrendatário: ${esc(C(a.inquilinoId).nome)} · ${fd(a.inicio)} → ${fd(a.fim)}</p><p>Renda: <b class="gold">${fmt(a.renda,a.moeda)}</b> · Gestão ${a.comGestao}%</p>${emAtraso(a).map(x=>`<div class="alert bad">${fmes(x.mes)}: em falta ${fmt(x.falta,a.moeda)}</div>`).join('')||'<div class="alert ok">Rendas em dia</div>'}
   <h4>Últimos pagamentos</h4>${a.pagamentos.slice(-4).reverse().map(p=>`<div class="list-item sm"><span>${fmes(p.mes)} · ${fd(p.data)}</span><b>${fmt(p.v,a.moeda)}</b></div>`).join('')}</div>`).join('')}</div>
   <div class="card" style="margin-top:14px"><h3>Manutenção</h3>${ms.map(m=>`<div class="list-item"><div>${fd(m.d)} · ${esc(m.desc)}<br><span class="mut sm">${esc((S.fornecedores.find(f=>f.id===m.fornecedorId)||{}).nome||'Fornecedor por atribuir')}${m.custo?' · '+fmt(m.custo,m.moeda):''}</span></div>${tag(...MEST[m.estado])}</div>`).join('')||'<p class="mut">Sem intervenções.</p>'}</div>
   <div class="row" style="margin:20px 0 10px"><h2 style="margin:0">Prestação de contas</h2><input type="month" value="${mes}" onchange="V.res.mes=this.value;render()" style="width:180px"><button class="btn" onclick="copyText(extratoTxt('${c.id}','${mes}'),'Extrato copiado')">Copiar extrato</button></div>${extratoHTML(c.id,mes)}`}
 if(V.res.tab==='arrendatario'){body=ten.map(a=>{const p=P(a.propId);const meses=mesesDevidos(a);const ms=S.manut.filter(m=>m.propId===a.propId);return `<div class="grid g2"><div class="card"><h3>O meu contrato</h3><img src="${photos(p)[0]}" style="width:100%;border-radius:10px;margin-bottom:10px"><p><b>${esc(p.titulo)}</b><br><span class="mut sm">${esc(p.bairro)}, ${esc(p.municipio)}</span></p><p class="sm">Período: ${fd(a.inicio)} → ${fd(a.fim)}<br>Renda: <b class="gold">${fmt(a.renda,a.moeda)}</b> · vence no dia ${a.dia}<br>Caução: ${fmt(a.caucao,a.moeda)}<br>Renovação: ${a.renovacao} · pré-aviso ${a.preAviso} dias</p></div>
  <div class="card"><h3>Pagamentos</h3>${a.gestao?[...meses].reverse().map(m=>{const pg=pagoMes(a,m);return `<div class="list-item sm"><span>${fmes(m)}</span><span>${fmt(pg,a.moeda)}</span>${pg>=a.renda-0.005?tag('Pago','ok'):tag(pg?'Parcial':'Em falta','bad')}</div>`}).join(''):'<p class="mut">As rendas são pagas diretamente ao proprietário.</p>'}
  <h3 style="margin-top:18px">Pedidos de manutenção</h3>${ms.map(m=>`<div class="list-item sm"><span>${fd(m.d)} · ${esc(m.desc)}</span>${tag(...MEST[m.estado])}</div>`).join('')||'<p class="mut sm">Sem pedidos.</p>'}
  <div id="fmt_${a.id}" style="margin-top:10px"><textarea name="desc" rows="2" placeholder="Descreva o problema (ex.: fuga de água na cozinha)"></textarea><button class="btn gold sm" style="margin-top:6px" onclick="tenantReq('${a.id}')">Enviar pedido de manutenção</button></div></div></div>`}).join('')}
 return pubHeader()+`<main class="wrap" style="padding:30px 20px 60px"><div class="row between"><div><p class="eyebrow">Área reservada</p><h1>Olá, ${esc(c.nome.split(' ')[0])}</h1><p class="mut">O seu corretor: <b>${esc(cor.nome)}</b> · <a href="${waLink(cor.tel,'Olá '+cor.nome.split(' ')[0]+', ')}" target="_blank" rel="noopener">WhatsApp ${esc(cor.tel)}</a></p></div><button class="btn ghost" onclick="resLogout()">Sair</button></div>
 <div class="tabs">${tabs.map(([k,l])=>`<a class="${V.res.tab===k?'on':''}" onclick="V.res.tab='${k}';render()">${l}</a>`).join('')}</div>${body}</main>`+pubFooter()}
function resLogout(){log('Saída da área reservada');V.res.cli=null;V.res.tab='';render()}
function tenantReq(aid){const a=S.arrend.find(x=>x.id===aid);const d=fd2('#fmt_'+aid);if(!d.desc){toast('Descreva o problema');return}S.manut.push({id:uid('m'),propId:a.propId,arrId:aid,d:today(),desc:d.desc,origem:'inquilino',fornecedorId:'',estado:'aberto',custo:null,moeda:a.moeda,notas:''});log(`Pedido de manutenção do arrendatário — ${P(a.propId).ref}`);render();toast('Pedido enviado. A equipa de gestão vai contactá-lo.')}
function resLogin(){return pubHeader()+`<div class="login" style="min-height:70vh"><div class="card"><div class="bigic">${logoIcon()}</div><p style="text-align:center;margin:0 0 6px"><span class="eyebrow">Área reservada</span></p><h2 style="text-align:center">Aceda à sua conta</h2>
 <div class="grid"><div><label>Cliente (demonstração)</label><select id="rsCli">${[['comprador','Compradores / interessados'],['arrendatario','Arrendatários'],['proprietario','Proprietários']].map(([t,l])=>`<optgroup label="${l}">${S.clientes.filter(c=>c.tipos.includes(t)).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</optgroup>`).join('')}</select></div>
 <button class="btn gold" onclick="V.res.cli=$('#rsCli').value;V.res.tab='';log('Entrada na área reservada');render()">Entrar</button>
 <p class="note">Protótipo: escolha um cliente para ver a respetiva área. Em produção, o acesso é feito com e-mail/telefone e código de verificação enviado por SMS ou WhatsApp.</p>
 <p class="mut sm">Sugestões: <b>Carlos Andrade</b> (comprador com reserva), <b>Manuel Domingos</b> (proprietário com gestão), <b>Marta Cassoma</b> (arrendatária).</p></div></div></div>`+pubFooter()}

/* ---------------- calendário (abre ao clicar em qualquer campo de data) ---------------- */
const CDP=!/firefox/i.test(navigator.userAgent)&&!/^((?!chrome|android).)*safari/i.test(navigator.userAgent)&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
let DP=null;
function calMarks(t){if(t.dataset.cal!=='vis')return{};const box=t.closest('.modal')||document;const g=n=>{const e=box.querySelector(`[name=${n}]`);return e?e.value:''};const cor=g('corretorId'),prop=g('propId'),cli=g('clienteId');const o={};
 S.visitas.forEach(v=>{if(v.estado==='cancelada'||v.id===t.dataset.excl)return;if((cor&&v.corretorId===cor)||(prop&&v.propId===prop)||(cli&&v.clienteId===cli))o[v.data]=(o[v.data]||0)+1});return o}
function openDP(t){closeDP();const v=t.value||t.min||today();DP={t,ym:v.slice(0,7)};drawDP()}
function drawDP(){const{t,ym}=DP;let el=document.querySelector('.dp');if(!el){el=document.createElement('div');el.className='dp';document.body.appendChild(el)}
 const[y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1,12);const off=(first.getDay()+6)%7;const start=addD(iso(first),-off);const marks=calMarks(t);const T=today();let cells='';
 for(let i=0;i<42;i++){const d=addD(start,i);const dis=(t.min&&d<t.min)||(t.max&&d>t.max);const n=marks[d]||0;cells+=`<button type="button" class="${d.slice(0,7)!==ym?'out':''} ${d===T?'today':''} ${d===t.value?'sel':''}" ${dis?'disabled':''} ${n?`title="${n} visita(s) marcada(s)"`:''} onclick="pickDP('${d}')">${+d.slice(8)}${n?'<i></i>':''}</button>`}
 const nome=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1]+' '+y;
 el.innerHTML=`<div class="dp-h"><button type="button" class="btn sm ghost" onclick="navDP(-1)">‹</button><b>${nome}</b><button type="button" class="btn sm ghost" onclick="navDP(1)">›</button></div><div class="dp-g">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div><div class="dp-f"><button type="button" class="btn sm" onclick="pickDP('${T}')" ${t.min&&T<t.min?'disabled':''}>Hoje</button>${Object.keys(marks).length?'<span class="sm"><span style="color:var(--sea)">●</span> dias com visitas</span>':''}<button type="button" class="btn sm ghost" onclick="closeDP()">Fechar</button></div>`;
 const r=t.getBoundingClientRect();const h=el.offsetHeight,w=el.offsetWidth;let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);el.style.top=top+'px';el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px'}
function navDP(n){DP.ym=addM(DP.ym,n);drawDP()}
function pickDP(d){const t=DP.t;closeDP();t.value=d;t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}))}
function closeDP(){const el=document.querySelector('.dp');if(el)el.remove();DP=null}
if(CDP)document.body.classList.add('cdp');
document.addEventListener('click',e=>{const t=e.target;if(CDP&&t.matches&&t.matches('input[type=date]')&&!t.disabled&&!t.readOnly){e.preventDefault();if(DP&&DP.t===t)closeDP();else openDP(t);return}if(DP&&!t.closest('.dp'))closeDP()},true);
document.addEventListener('keydown',e=>{if(CDP&&e.target.matches&&e.target.matches('input[type=date]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDP(e.target)}},true);
window.addEventListener('scroll',e=>{if(DP&&!(e.target.closest&&e.target.closest('.dp')))closeDP()},true);
window.addEventListener('resize',closeDP);
['change','input'].forEach(ev=>$('#modal').addEventListener(ev,e=>{if(e.target.closest('#fvis'))checkVis();else if(e.target.closest('#cform')&&['data','hora'].includes(e.target.name))checkPub()}));

/* ---------------- arranque ---------------- */
if(!window.KIANDA_API){load();
(function(){const h=decodeURIComponent(location.hash.slice(1));if(h==='interno')V.view='interno';else if(h==='reservada')V.view='reservada';render();
 if(h.startsWith('imovel-')){const p=S.props.find(x=>x.ref===h.slice(7));if(p&&p.publicado)openProp(p.id)}})();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(DP)closeDP();else closeModal()}});
idbOpen().then(idbLoadAll).then(()=>{if(Object.keys(IMG).length&&!$('.mbg'))render()});
</script>
